# Fine-tuning config for GCP Marker Detection with DEIMv2-X
# Backbone (DINOv3) is FROZEN; only HybridEncoder + DEIMTransformer are trained.
#
# LR schedule: warmup (0-5 epochs) → cosine decay (5-40 epochs) → constant (40-100 epochs)
# Loaded from: ~/Downloads/deimv2_dinov3_x_coco.pth
#
# Usage (single GPU):
#   python tools/train_finetune.py \
#       -c configs/deimv2/finetune_gcp.yml \
#       --pretrained ~/Downloads/deimv2_dinov3_x_coco.pth \
#       --use-amp --seed 42
#
# Usage (multi-GPU):
#   torchrun --nproc_per_node=4 tools/train_finetune.py \
#       -c configs/deimv2/finetune_gcp.yml \
#       --pretrained ~/Downloads/deimv2_dinov3_x_coco.pth \
#       --use-amp --seed 42

__include__: [
  '../dataset/gcp_detection.yml',
  '../runtime.yml',
  '../base/dataloader.yml',
  '../base/optimizer.yml',
  '../base/deimv2.yml',
]

output_dir: ./outputs/gcp_finetune

# ── Model ─────────────────────────────────────────────────────────────
DEIM:
  backbone: DINOv3STAs

DINOv3STAs:
  name: dinov3_vits16plus
  weights_path: ./ckpts/dinov3_vits16plus_pretrain_lvd1689m-4057cbaa.pth
  interaction_indexes: [5, 8, 11]
  finetune: False          # backbone weights are FROZEN
  conv_inplane: 64
  hidden_dim: 256

HybridEncoder:
  in_channels: [256, 256, 256]
  hidden_dim: 256
  dim_feedforward: 1024
  expansion: 1.25
  depth_mult: 1.37

DEIMTransformer:
  num_layers: 6
  eval_idx: -1
  feat_channels: [256, 256, 256]
  hidden_dim: 256
  dim_feedforward: 2048

# ── Training schedule ─────────────────────────────────────────────────
epoches: 100

# FlatCosineLRScheduler via lrsheduler hook in det_solver:
#   warmup: 0 → warmup_iter steps (≈ 5 epochs, computed at runtime)
#   cosine: warmup_iter → (total - no_aug) steps
#   constant: (total - no_aug) → total steps
#
# flat_epoch = warmup end epoch (no flat phase → cosine starts right after warmup)
# no_aug_epoch = 100 - 40 = 60  (constant from epoch 40 to 100)
lrsheduler: FlatCosine
flat_epoch: 5       # warmup duration in epochs; cosine starts immediately after
no_aug_epoch: 60    # constant-LR phase lasts for the last 60 epochs (epoch 40-100)
lr_gamma: 0.01      # min_lr = base_lr * lr_gamma  (e.g. 2e-4 * 0.01 = 2e-6)

# warmup_iter is set at runtime by train_finetune.py (= 5 * iter_per_epoch)
warmup_iter: 500    # placeholder; overridden by the training script

# ── Optimizer: only encoder + decoder, backbone is frozen ─────────────
optimizer:
  type: AdamW
  params:
    -
      # backbone → zero lr (kept in graph but gradient is blocked by requires_grad=False)
      params: '^(?=.*(?:backbone|dinov3|sta)).*$'
      lr: 0.0
      weight_decay: 0.0
    -
      # encoder / decoder norms → no weight decay
      params: '^(?=.*(?:encoder|decoder))(?=.*(?:norm|bn|bias)).*$'
      weight_decay: 0.0
  lr: 0.0002          # base lr for encoder + decoder
  betas: [0.9, 0.999]
  weight_decay: 0.0001

use_amp: True
sync_bn: False   # SyncBN is for multi-GPU; on single GPU it wastes memory
use_ema: False   # EMA is a full model copy (~200 MB); disable to fit 6 GB GPU
                 # Set use_ema: True if you have ≥10 GB GPU

clip_max_norm: 0.1

# ── Data ──────────────────────────────────────────────────────────────
train_dataloader:
  total_batch_size: 2    # 2 for ~8 GB GPU, 1 for ~6 GB GPU (X model is large)
                         # use gradient accumulation in train_finetune.py if needed
  dataset:
    transforms:
      ops:
        - {type: RandomPhotometricDistort, p: 0.5}
        - {type: RandomZoomOut, fill: 0}
        - {type: RandomIoUCrop, p: 0.8}
        - {type: SanitizeBoundingBoxes, min_size: 1}
        - {type: RandomHorizontalFlip}
        - {type: Resize, size: [640, 640]}
        - {type: SanitizeBoundingBoxes, min_size: 1}
        - {type: ConvertPILImage, dtype: 'float32', scale: True}
        - {type: Normalize, mean: [0.485, 0.456, 0.406], std: [0.229, 0.224, 0.225]}
        - {type: ConvertBoxes, fmt: 'cxcywh', normalize: True}
      policy:
        epoch: [0, 80, 100]   # [start, mid, end] — no mosaic needed for fine-tuning
        ops: ['RandomPhotometricDistort', 'RandomZoomOut', 'RandomIoUCrop']

  collate_fn:
    type: BatchImageCollateFunction
    base_size: 640
    base_size_repeat: ~     # null = disable multi-scale (DINOv3 pos-embed is fixed at 640)
    # Disable two-stage EMA reload: stop_epoch must be > total epochs
    stop_epoch: 200
    ema_restart_decay: 0.9999
    # Disable MixUp and CopyBlend (from base/deimv2.yml) — CutMix handles balancing
    mixup_prob: 0.0
    mixup_epochs: [0, 0]
    copyblend_prob: 0.0
    copyblend_epochs: [0, 0]
    # Class-balanced CutMix: active for entire training
    cutmix_prob: 0.5
    cutmix_epochs: [0, 100]
    cutmix_context_pad: 2.0      # 2x bbox side = enough context around the marker
    cutmix_max_attempts: 30      # attempts to find a non-overlapping paste location

val_dataloader:
  total_batch_size: 4    # base config sets 64 which OOMs on small GPU
  dataset:
    transforms:
      ops:
        - {type: Resize, size: [640, 640]}
        - {type: ConvertPILImage, dtype: 'float32', scale: True}
        - {type: Normalize, mean: [0.485, 0.456, 0.406], std: [0.229, 0.224, 0.225]}
