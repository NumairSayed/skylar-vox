# Fine-tuning config for GCP Marker Detection — CNN decoder variant
#
# Replaces the transformer decoder (DEIMTransformer) with a lightweight
# dense CNN head (GCPCNNDecoder) operating on the stride-8 FPN feature map.
#
# Motivation: GCP markers are ~12 px in 640-px frames. A 3×3 conv covers
# 24 px of receptive field, enclosing the marker. The dense 80×80 grid
# (6 400 locations) cannot miss a marker the way sparse query-based
# attention can.
#
# Usage:
#   python tools/train_finetune.py \
#       -c configs/deimv2/finetune_gcp_cnn.yml \
#       --pretrained ~/Downloads/deimv2_dinov3_x_coco.pth \
#       --use-amp --seed 42 --wandb-project gcp-detection

__include__: [
  '../dataset/gcp_detection.yml',
  '../runtime.yml',
  '../base/dataloader.yml',
  '../base/optimizer.yml',
]

task: detection
model: DEIM
criterion: DEIMCriterion
postprocessor: PostProcessor

use_focal_loss: True
eval_spatial_size: [640, 640]
checkpoint_freq: 5

output_dir: ./outputs/gcp_cnn

# ── Model ─────────────────────────────────────────────────────────────
DEIM:
  backbone: DINOv3STAs
  encoder: HybridEncoder
  decoder: GCPCNNDecoder

DINOv3STAs:
  name: dinov3_vits16plus
  weights_path: ./ckpts/dinov3_vits16plus_pretrain_lvd1689m-4057cbaa.pth
  interaction_indexes: [5, 8, 11]
  finetune: False
  conv_inplane: 64
  hidden_dim: 256

HybridEncoder:
  in_channels: [256, 256, 256]
  hidden_dim: 256
  dim_feedforward: 1024
  expansion: 1.25
  depth_mult: 1.37
  use_encoder_idx: [2]
  num_encoder_layers: 1
  nhead: 8
  dropout: 0.
  enc_act: 'gelu'
  act: 'silu'
  version: deim
  csp_type: csp2
  fuse_op: sum

GCPCNNDecoder:
  in_channels: 256
  hidden_dim: 256
  num_classes: 3
  num_stem_convs: 3
  p3_index: 0            # index 0 = stride-8 feature map from HybridEncoder

PostProcessor:
  num_top_queries: 10    # at most 10 detections per image (dataset has 1 GCP/image)

# ── Loss ──────────────────────────────────────────────────────────────
# Skip 'mal' and 'local' — they rely on DEIMTransformer-specific internals
DEIMCriterion:
  weight_dict: {loss_vfl: 1, loss_bbox: 5, loss_giou: 2}
  losses: ['vfl', 'boxes']
  gamma: 1.5
  alpha: 0.75
  reg_max: 32            # unused but required by DEIMCriterion __init__
  use_uni_set: False     # no aux_outputs from CNN decoder

  matcher:
    type: HungarianMatcher
    weight_dict: {cost_class: 2, cost_bbox: 5, cost_giou: 2}
    alpha: 0.25
    gamma: 2.0

# ── Training schedule ─────────────────────────────────────────────────
epoches: 100

lrsheduler: FlatCosine
flat_epoch: 5
no_aug_epoch: 60
lr_gamma: 0.01
warmup_iter: 500         # overridden at runtime by train_finetune.py

# ── Optimizer ─────────────────────────────────────────────────────────
optimizer:
  type: AdamW
  params:
    -
      params: '^(?=.*(?:backbone|dinov3|sta)).*$'
      lr: 0.0
      weight_decay: 0.0
    -
      params: '^(?=.*(?:encoder|decoder))(?=.*(?:norm|bn|bias)).*$'
      weight_decay: 0.0
  lr: 0.0002
  betas: [0.9, 0.999]
  weight_decay: 0.0001

use_amp: True
sync_bn: False
use_ema: False
clip_max_norm: 0.1

# ── Data ──────────────────────────────────────────────────────────────
train_dataloader:
  total_batch_size: 2
  dataset:
    transforms:
      ops:
        - {type: RandomPhotometricDistort, p: 0.5}
        - {type: RandomZoomOut, fill: 0}
        - {type: RandomIoUCrop, p: 0.8}
        - {type: SanitizeBoundingBoxes, min_size: 1}
        - {type: RandomHorizontalFlip}
        - {type: Resize, size: [640, 640]}
        - {type: SanitizeBoundingBoxes, min_size: 1}
        - {type: ConvertPILImage, dtype: 'float32', scale: True}
        - {type: Normalize, mean: [0.485, 0.456, 0.406], std: [0.229, 0.224, 0.225]}
        - {type: ConvertBoxes, fmt: 'cxcywh', normalize: True}
      policy:
        epoch: [0, 80, 100]
        ops: ['RandomPhotometricDistort', 'RandomZoomOut', 'RandomIoUCrop']

  collate_fn:
    type: BatchImageCollateFunction
    base_size: 640
    base_size_repeat: ~
    stop_epoch: 200
    ema_restart_decay: 0.9999
    mixup_prob: 0.0
    mixup_epochs: [0, 0]
    copyblend_prob: 0.0
    copyblend_epochs: [0, 0]
    cutmix_prob: 0.5
    cutmix_epochs: [0, 100]
    cutmix_context_pad: 2.0
    cutmix_max_attempts: 30

val_dataloader:
  total_batch_size: 4
  dataset:
    transforms:
      ops:
        - {type: Resize, size: [640, 640]}
        - {type: ConvertPILImage, dtype: 'float32', scale: True}
        - {type: Normalize, mean: [0.485, 0.456, 0.406], std: [0.229, 0.224, 0.225]}
